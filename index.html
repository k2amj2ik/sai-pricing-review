<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>보호된 문서</title>
<style>
:root{--ink:#1a1a1a;--sub:#6b6b6b;--line:#e5e2dc;--bg:#f7f5f1;--accent:#8a7a52;--card:#fff;--danger:#b23b3b;--sel:#eef4ec}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Malgun Gothic","맑은 고딕",sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
.lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.lockcard{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:400px;width:100%;padding:34px 28px;box-shadow:0 10px 30px rgba(0,0,0,.06);text-align:center}
.lockcard h1{font-size:18px;margin:10px 0 4px}.lockcard p{font-size:13px;color:var(--sub);margin:6px 0 20px}
.lockcard input{width:100%;padding:12px 14px;font-size:15px;border:1px solid var(--line);border-radius:10px;outline:none}
.lockcard input:focus{border-color:var(--accent)}
.lockcard button{width:100%;margin-top:12px;padding:12px;font-size:15px;font-weight:600;color:#fff;background:var(--ink);border:0;border-radius:10px;cursor:pointer}
.lockcard button:disabled{opacity:.5}.err{color:var(--danger);font-size:13px;margin-top:12px;min-height:18px}
.lockbadge{display:inline-block;font-size:11px;font-weight:700;color:var(--danger);border:1px solid var(--danger);border-radius:999px;padding:3px 10px}
.wrap{max-width:960px;margin:0 auto;padding:20px 18px 80px}
.topbar{position:sticky;top:0;background:rgba(247,245,241,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:10px;z-index:5}
.topbar .in{max-width:960px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.topbar b{font-size:15px}
.banner{background:#fbeaea;border:1px solid #eccaca;color:#7a2b2b;border-radius:10px;padding:10px 14px;font-size:13px;margin:8px 0 18px}
h2.sec{font-size:17px;border-left:4px solid var(--accent);padding-left:10px;margin:34px 0 12px}
p{font-size:14px}.muted{color:var(--sub);font-size:12.5px}.foot{color:var(--sub);font-size:12px;margin-top:30px;border-top:1px solid var(--line);padding-top:12px}
.wtbl{border-collapse:collapse;font-size:13px}.wtbl th,.wtbl td{border:1px solid var(--line);padding:6px 12px;text-align:left}.wtbl th{background:#efece5}
.artist{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:16px;margin:16px 0}
.artist h3{margin:0 0 12px;font-size:16px}.scope{font-size:11px;color:#fff;background:var(--accent);border-radius:999px;padding:2px 9px;vertical-align:middle;margin-left:6px}
.anchor{display:flex;gap:12px;align-items:flex-start;background:#faf7ef;border:1px solid #e8e0cc;border-radius:10px;padding:10px;margin-bottom:12px}
.ainfo{font-size:13px}.lab{display:inline-block;font-size:10px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 6px;margin-bottom:4px}
.am{color:var(--sub);font-size:12px}.res{font-weight:600;font-size:12.5px}.areason{color:var(--sub);font-size:11.5px;margin-top:4px}
.th{width:74px;height:74px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#fff;flex:none}
.th.ph{display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--sub);text-align:center}
.tw{overflow-x:auto}.sctbl{border-collapse:collapse;width:100%;font-size:12px;min-width:640px}
.sctbl th,.sctbl td{border:1px solid var(--line);padding:6px 8px;text-align:center}.sctbl th{background:#efece5;font-size:11px}
.sctbl td.wc,.sctbl th.wc{text-align:left;width:46%}.wc{display:table-cell}
.sctbl .wc{display:flex;gap:8px;align-items:center}.wt{font-size:12px}.sctbl .tot{font-weight:700}
.sctbl tr.sel{background:var(--sel)}.miss{display:inline-block;font-size:10.5px;color:#a05a2c;background:#fbf0e3;border-radius:4px;padding:0 5px;margin-left:4px}
.q{background:#fff;border:1px solid var(--line);border-left:4px solid var(--danger);border-radius:8px;padding:12px 14px;margin:10px 0;font-size:13px}
.report-shot{width:100%;border:1px solid var(--line);border-radius:8px;display:block;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.dnote{display:inline-block;font-size:11px;color:#2e4a2a;background:#eef4ec;border-radius:4px;padding:1px 6px;margin-top:2px}
</style></head>
<body>
<div id="lock" class="lock"><form class="lockcard" id="lockform" autocomplete="off">

<script>
const B=JSON.parse(document.getElementById('blob').textContent);
function b2b(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
async function unlock(pw){const enc=new TextEncoder();
 const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
 const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b2b(B.salt),iterations:B.iter,hash:'SHA-256'},km,256);
 const key=await crypto.subtle.importKey('raw',bits,'AES-GCM',false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2b(B.iv),tagLength:128},key,b2b(B.ct));
 return JSON.parse(new TextDecoder().decode(pt));}
document.getElementById('lockform').addEventListener('submit',async(e)=>{e.preventDefault();
 const err=document.getElementById('err'),go=document.getElementById('go');err.textContent='';go.disabled=true;go.textContent='여는 중…';
 try{const d=await unlock(document.getElementById('pw').value);document.getElementById('app').innerHTML=d.innerHtml;
   document.getElementById('lock').style.display='none';document.getElementById('app').style.display='block';}
 catch(_){err.textContent='비밀번호가 올바르지 않습니다.';go.disabled=false;go.textContent='열기';}});
</script></body></html>
